<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scan QR Code</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
    }
    .label {
      font-size: 18px;
      color: #444;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }
    .qr-wrap {
      width: min(90vw, 90vh);
      height: min(90vw, 90vh);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .qr-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
    }
    .url {
      margin-top: 20px;
      font-size: 14px;
      color: #888;
    }
  </style>
</head>
<body>
  <p class="label">📱 Point your camera here</p>
  <div class="qr-wrap">
    <img src="/assets/qr_mobile_scan.png" alt="QR Code" />
  </div>
  <p class="url">bunnybirthday.vercel.app</p>
</body>
</html>
